<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Project-owned placeholder icon: blue rounded square with a plain
       geometric microphone silhouette. Intentionally simple shapes only
       (no SF Symbol glyph data) so it can be freely redistributed and
       regenerated by scripts/package-app.sh via sips/iconutil. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9DFF"/>
      <stop offset="100%" stop-color="#1E5FCC"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="192" ry="192" fill="url(#bg)"/>

  <!-- Microphone capsule -->
  <rect x="404" y="200" width="216" height="380" rx="108" ry="108" fill="#FFFFFF"/>

  <!-- Microphone stand (basket arc) -->
  <path d="M 320 480
           A 192 192 0 0 0 704 480"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="44"
        stroke-linecap="round"/>

  <!-- Stand post -->
  <rect x="490" y="620" width="44" height="140" rx="22" ry="22" fill="#FFFFFF"/>

  <!-- Base -->
  <rect x="392" y="756" width="240" height="44" rx="22" ry="22" fill="#FFFFFF"/>
</svg>
